[package]
name = "nshbench"
version = "0.2.0"
edition = "2024"

[workspace]

[dependencies]
# Native Shell 0.2.0 (latest stable release, crates.io; = git tag v0.2.0, 669b62b, 2026-10-22).
# Rust-only app on the GTK 4 backend: no QuickJS (`js` off), no WebKitGTK (`webview` off).
nsh-core = "=0.2.0"
nsh-base = { version = "=0.2.0", default-features = false }
nsh-platform-linux = { version = "=0.2.0", default-features = false }
# The benchmark's C-ABI core, by relative path (no absolute path).
benchcore = { path = "../../../core" }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false
