<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" font-family="Helvetica,Arial,sans-serif" font-size="12">
<rect width="900" height="280" fill="#fff"/>
<text x="16" y="26" font-size="17" font-weight="bold" fill="#222">Temps de démarrage jusqu'au premier pixel</text>
<text x="16" y="46" fill="#555">Application déjà en cache disque, arbre statique de N nœuds. Plus court = mieux (échelle log).</text>
