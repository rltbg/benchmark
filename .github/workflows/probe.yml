name: probe-runners
on:
  push:
    branches: ['ci/probe']
permissions:
  contents: read
jobs:
  info:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: relevé du runner
        shell: bash
        run: bash ci/probe.sh "${{ matrix.os }}" > "probe-${{ matrix.os }}.txt" 2>&1 || true
      - uses: actions/upload-artifact@v7
        with:
          name: probe-${{ matrix.os }}
          path: probe-${{ matrix.os }}.txt
  publish:
    needs: info
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: results
          pattern: probe-*
          merge-multiple: true
      - name: publier dans la branche ci-results
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -e
          git config --global user.name "ci-bot"; git config --global user.email "ci-bot@users.noreply.github.com"
          git init -q out && cd out
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git fetch -q --depth 1 origin ci-results 2>/dev/null; then git checkout -q -B ci-results FETCH_HEAD; else git checkout -q -b ci-results; fi
          mkdir -p "probe/${RUN_ID}"; cp ../results/* "probe/${RUN_ID}/"
          git add -A; git commit -q -m "probe runners ${RUN_ID} [skip ci]"
          git push -q origin ci-results
