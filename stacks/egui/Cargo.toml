[package]
name = "egui_bench"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["x11", "default_fonts"] }
egui = "=0.37.0"
image = { version = "0.25", default-features = false, features = ["png"] }
benchcore = { path = "../../core" }

[features]
default = ["glow"]
glow = ["eframe/glow"]
wgpu = ["eframe/wgpu"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = false
