[package]
name = "slintapp"
version = "0.2.0"
edition = "2024"

[dependencies]
# Versions épinglées (dernières stables d'index.crates.io, vérifiées le 2026-10-26)
slint = { version = "=1.18.1", default-features = false, features = [
  "std", "compat-1-18", "backend-winit-x11",
  "renderer-skia",            # variante principale : SLINT_BACKEND équivalent winit-skia-software
  "renderer-software", "software-renderer-path",  # variante secondaire : moteur logiciel natif de Slint
  "renderer-femtovg",         # variante tertiaire : FemtoVG/OpenGL sur llvmpipe (CPU)
  "unstable-winit-030",       # CustomApplicationHandler + WinitWindowAccessor (API publique, marquée unstable)
] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
serde_json = "=1.0.154"
# cœur C-ABI : crate rlib du dépôt (dépendance path relative, pas de staticlib -> une seule libstd)
benchcore = { path = "../../../core" }

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true
