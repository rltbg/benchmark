[package]
name = "slintapp"
version = "0.1.0"
edition = "2021"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit-x11", "renderer-software", "renderer-femtovg", "software-renderer-path", "compat-1-2", "image-default-formats", "unstable-winit-030"] }
serde_json = "1"

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true
